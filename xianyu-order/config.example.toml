# 選用設定。不建立 config.toml 也能用，會套用預設值。
# 要用時：copy config.example.toml config.toml

# 用電腦上的 Chrome；沒裝 Chrome 可改成 "msedge"
browser_channel = "chrome"

# 確認頁的應付總額最多可以比你給的價格多出多少（運費）。
# 0 = 只接受包郵；例如設 15，給 1000 元時總額 1015 以內才會提交。
max_shipping = 0

# 下單完成或失敗時推播到手機（選填，擇一即可）
[notify]
ntfy_topic = ""        # ntfy App 訂閱的主題名稱
telegram_token = ""
telegram_chat_id = ""
bark_key = ""          # iPhone 的 Bark App
